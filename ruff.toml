line-length = 120
select = ["ALL"]
ignore = [
    "ERA001",  # Commented out code
    "T201",    # print() found
    "PLR2004", # Magic number
    "D",       # Missing docstring
    "PTH",     # Pathlib should be used over os.path
    "E741",    # Ambiguous variable name e.g. 'l'
    "N803",    # Argument name should be lowercase (for X_train)
    "N806",    # Variable in function should be lowercase (for X_train)
    "NPY002",  # np.number is deprecated
    "PLR0913", # Too many arguments
    "PLC0415", # Import should be at the top of the file
    "S101",    # Use of assert detected
    "ANN",     # Missing type annotation (turn off for now, otherwise I can't log model to mlflow properly)
]
